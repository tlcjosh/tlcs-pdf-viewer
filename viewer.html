<script>
  const params = new URLSearchParams(location.search);

  // Priority:
  // 1) doc= (assumes /pdf/<doc>)
  // 2) file= (absolute URL or root-relative path)
  const doc = params.get("doc");
  const fileParam = params.get("file");

  let file = null;

  if (doc) {
    // Allow doc to include subfolders like "reports/AnnualReport2025.pdf" if you want.
    file = `pdf/${doc}`;
  } else if (fileParam) {
    file = fileParam;
  }

  if (!file) {
    document.body.innerText = "Missing ?doc=FILENAME.pdf or ?file=PDF_URL";
  } else {
    const viewerURL = new URL("./web/viewer.html", location.href);

    // Make the PDF URL absolute against the *site root* (works for absolute URLs too).
    // Examples:
    // - "pdf/AnnualReport2025.pdf" -> https://.../pdf/AnnualReport2025.pdf
    // - "https://..." -> https://...
    const fileURL = new URL(file, location.href).toString();

    viewerURL.searchParams.set("file", fileURL);
    document.getElementById("f").src = viewerURL.toString();
  }
</script>
