<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PDF Viewer</title>
    <style>
      html, body { height: 100%; margin: 0; }
      iframe { border: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <iframe id="f" allow="fullscreen"></iframe>

    <script>
      (function () {
        const iframe = document.getElementById("f");
        if (!iframe) {
          // Should never happen, but avoids hard crashes.
          document.body.innerText = "Viewer iframe not found.";
          return;
        }

        const params = new URLSearchParams(location.search);

        // Priority:
        // 1) doc= (assumes /pdf/<doc>)
        // 2) file= (absolute URL or root-relative path)
        const doc = params.get("doc");
        const fileParam = params.get("file");

        let file = null;

        if (doc) {
          file = `pdf/${doc}`;
        } else if (fileParam) {
          file = fileParam;
        }

        if (!file) {
          document.body.innerText = "Missing ?doc=FILENAME.pdf or ?file=PDF_URL";
          return;
        }

        const viewerURL = new URL("./web/viewer.html", location.href);

        // Resolve relative file paths against *this site*, keep absolute URLs intact.
        const fileURL = new URL(file, location.href).toString();

        viewerURL.searchParams.set("file", fileURL);
        iframe.src = viewerURL.toString();
      })();
    </script>
  </body>
</html>
